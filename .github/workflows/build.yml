name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '*.cs3'
      - 'plugins.json'
      - 'repo.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp src/*/build/*.cs3 .
          cp build/plugins.json .
          # Single-branch: arahkan URL plugin ke branch main
          sed -i 's|/builds/|/main/|g' plugins.json
          printf '%s' '{ "name": "ScraJav", "description": "ScraJav extension repository", "manifestVersion": 1, "pluginLists": ["https://raw.githubusercontent.com/0xshitcode/ScraJav/main/plugins.json"] }' > repo.json

      - name: Push artifacts ke main
        env:
          PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git config --local credential.helper ""
          git remote set-url origin https://x-access-token:${PUSH_TOKEN}@github.com/0xshitcode/ScraJav.git
          git add -A
          # [skip ci] mencegah loop: push artefak tidak memicu workflow lagi
          git commit -m "Build $GITHUB_SHA [skip ci]" || exit 0
          git push
