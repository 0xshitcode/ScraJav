name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@master
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: |
          rm -f $GITHUB_WORKSPACE/builds/*.cs3
          rm -f $GITHUB_WORKSPACE/builds/plugins.json
          rm -f $GITHUB_WORKSPACE/builds/repo.json

      - name: Setup JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp src/*/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds
          cd $GITHUB_WORKSPACE/builds
          printf '%s' '{ "name": "ScraJav", "description": "ScraJav extension repository", "manifestVersion": 1, "pluginLists": ["https://raw.githubusercontent.com/0xshitcode/ScraJav/builds/plugins.json"] }' > repo.json

      - name: Push builds
        env:
          PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          # Hapus Authorization header GITHUB_TOKEN (read-only) dari actions/checkout
          # yang menimpa kredensial PAT di URL. PAT user dipakai untuk push.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin https://x-access-token:${PUSH_TOKEN}@github.com/0xshitcode/ScraJav.git
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # tidak error jika tidak ada perubahan
          git push --force
